<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Yapılacaklar</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="kart">
    <h1>Yapılacaklar</h1>

    <form id="form">
      <input id="girdi" placeholder="Yeni görev yaz..." autocomplete="off">
      <button type="submit">Ekle</button>
    </form>

    <div class="filtreler">
      <button class="filtre aktif" data-filtre="hepsi">Hepsi</button>
      <button class="filtre" data-filtre="aktif">Aktif</button>
      <button class="filtre" data-filtre="tamamlanan">Tamamlanan</button>
    </div>

    <ul id="liste"></ul>
    <p id="sayac"></p>
  </main>
  <script src="script.js"></script>
</body>
</html>
